apply plugin: 'com.android.application'

android {
    namespace 'akro.ghost.tele.settingsadapter'
    compileSdk 36

    defaultConfig {
        applicationId "akro.ghost.tele.settingsadapter"
        minSdk 27
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation libs.appcompat
}
