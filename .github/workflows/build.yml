name: 👻 Build AkroGhost APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options: [ debug, release ]

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4g"
  MAX_RETRIES: 3

jobs:
  build:
    name: 👻 AkroGhost Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─────────────────────────────────────────────
      - name: 📥 Checkout Source
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ─────────────────────────────────────────────
      - name: 🛠️ Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: 📦 Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      # ─────────────────────────────────────────────
      - name: 🔑 Create Debug Keystore (for release signing)
        run: |
          mkdir -p $HOME/.android
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "✅ Debug keystore created"
          else
            echo "✅ Debug keystore already exists"
          fi

      # ─────────────────────────────────────────────
      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # ─────────────────────────────────────────────
      - name: 🔐 Grant Gradlew Permission
        run: chmod +x gradlew

      # ─────────────────────────────────────────────
      - name: 🧹 Clean Project
        run: ./gradlew clean --stacktrace

      # ─────────────────────────────────────────────
      - name: 🔨 Build settingsadapter (DEX source)
        id: build_settingsadapter
        run: |
          echo "Building settingsadapter APK..."
          ./gradlew :settingsadapter:assembleDebug --stacktrace 2>&1 | tee settingsadapter_build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "❌ settingsadapter build failed"
            cat settingsadapter_build.log
            exit $EXIT
          fi
          echo "✅ settingsadapter built successfully"
          find settingsadapter/build -name "*.apk" | head -5

      # ─────────────────────────────────────────────
      - name: 🏗️ Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        id: build_debug
        run: |
          set +e
          ATTEMPT=0
          SUCCESS=false

          while [ $ATTEMPT -lt ${{ env.MAX_RETRIES }} ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "🔄 Build attempt $ATTEMPT / ${{ env.MAX_RETRIES }}"

            ./gradlew assembleDebug --stacktrace 2>&1 | tee build_debug_$ATTEMPT.log
            EXIT=${PIPESTATUS[0]}

            if [ $EXIT -eq 0 ]; then
              echo "✅ Debug build succeeded on attempt $ATTEMPT"
              SUCCESS=true
              break
            fi

            echo "❌ Attempt $ATTEMPT failed. Analyzing error..."
            tail -50 build_debug_$ATTEMPT.log

            # Auto-fix: clear caches and retry
            if [ $ATTEMPT -lt ${{ env.MAX_RETRIES }} ]; then
              echo "🔧 Clearing Gradle caches for next attempt..."
              ./gradlew --stop || true
              rm -rf ~/.gradle/caches/modules-*/files-*/
              sleep 5
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ All ${{ env.MAX_RETRIES }} attempts failed"
            cat build_debug_${{ env.MAX_RETRIES }}.log
            exit 1
          fi

      # ─────────────────────────────────────────────
      - name: 🏗️ Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        id: build_release
        run: |
          set +e
          ATTEMPT=0
          SUCCESS=false

          while [ $ATTEMPT -lt ${{ env.MAX_RETRIES }} ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "🔄 Build attempt $ATTEMPT / ${{ env.MAX_RETRIES }}"

            ./gradlew assembleRelease --stacktrace 2>&1 | tee build_release_$ATTEMPT.log
            EXIT=${PIPESTATUS[0]}

            if [ $EXIT -eq 0 ]; then
              echo "✅ Release build succeeded on attempt $ATTEMPT"
              SUCCESS=true
              break
            fi

            echo "❌ Attempt $ATTEMPT failed"
            tail -60 build_release_$ATTEMPT.log

            if [ $ATTEMPT -lt ${{ env.MAX_RETRIES }} ]; then
              echo "🔧 Clearing caches and retrying..."
              ./gradlew --stop || true
              rm -rf ~/.gradle/caches/modules-*/files-*/
              sleep 5
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ All ${{ env.MAX_RETRIES }} release attempts failed"
            exit 1
          fi

      # ─────────────────────────────────────────────
      - name: 📋 Get Version Info
        id: version
        if: always()
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle | head -1 | sed "s/.*\"\(.*\)\".*/\1/")
          VERSION_CODE=$(grep 'versionCode' app/build.gradle | head -1 | grep -o '[0-9]*')
          echo "version_name=${VERSION_NAME:-1.0}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE:-1}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION_NAME} (${VERSION_CODE})"

      # ─────────────────────────────────────────────
      - name: 🔍 Find Built APKs
        if: success()
        run: |
          echo "=== Built APKs ==="
          find . -name "*.apk" \
            -not -path "*/intermediates/*" \
            -not -path "*/test/*" \
            -not -path "*settingsadapter*" \
            | sort
          echo "=== APK sizes ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true

      # ─────────────────────────────────────────────
      - name: 📤 Upload Debug APK
        if: ${{ success() && github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: AkroGhost-v${{ steps.version.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload Release APK
        if: ${{ success() && github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: AkroGhost-v${{ steps.version.outputs.version_name }}-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      # ─────────────────────────────────────────────
      - name: 📎 Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build_debug_*.log
            build_release_*.log
            settingsadapter_build.log
          retention-days: 7
          if-no-files-found: ignore

      # ─────────────────────────────────────────────
      - name: ✅ Build Summary
        if: always()
        run: |
          echo "## 👻 AkroGhost Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Version | ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Package | \`akro.ghost.tele\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Developer | @A_KOJO |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Build Type | ${{ github.event.inputs.build_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕐 Triggered by | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if find app/build/outputs/apk -name "*.apk" 2>/dev/null | grep -q .; then
            echo "### ✅ APK Ready" >> $GITHUB_STEP_SUMMARY
            find app/build/outputs/apk -name "*.apk" -exec bash -c 'echo "- $(basename $1) — $(du -h $1 | cut -f1)"' _ {} \; >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          else
            echo "### ❌ Build Failed — check logs artifact" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────
  release:
    name: 🚀 GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: 🔑 Create Debug Keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - run: chmod +x gradlew

      - name: 🏗️ Build Release
        run: ./gradlew :settingsadapter:assembleDebug assembleRelease --stacktrace

      - name: 📋 Get Version
        id: ver
        run: |
          V=$(grep 'versionName' app/build.gradle | head -1 | sed "s/.*\"\(.*\)\".*/\1/")
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: 🚀 Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AkroGhost 👻 v${{ steps.ver.outputs.version }}"
          body: |
            ## 👻 AkroGhost v${{ steps.ver.outputs.version }}

            LSPosed module — Ghost Mode & Premium features for Telegram

            **Package:** `akro.ghost.tele`
            **Developer:** @A_KOJO
            **Channel:** https://t.me/A_KOJO

            ### ✨ Features
            - 🕵️ Ghost Mode (hide seen / typing / online)
            - 📥 Save secret media & stories
            - 🔓 Local Telegram Premium unlock
            - 🗑️ Show deleted messages
            - ⚡ Ultra-fast downloads
            - 🎨 AkroGhost premium UI
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
